name: CyberGIS Center for Advanced Digital & Spatial Studies

image: https://cybergis.illinois.edu/wp-content/uploads/2018/06/cropped-CyberGIS.png

description: 'The CyberGIS Center for Advanced Digital & Spatial Studies, based at the University of Illinois, advances geospatial science by integrating high‑performance computing, big data analytics, and interdisciplinary research. It offers open‑source middleware, cloud‑based services, and educational resources to empower researchers, policymakers, and communities in tackling complex spatial challenges such as climate change, urban planning, and disaster response. Through collaborations with NSF and other partners, CyberGIS drives innovation in geospatial data processing, visualization, and collaborative analysis, fostering a sustainable future through shared cyberinfrastructure.'

